<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="400" viewBox="0 0 1128 400" role="img" aria-label="Change Lens — local diff for the code AI agents write">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#15110e"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#b4532a" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#b4532a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#221a14"/>
      <stop offset="1" stop-color="#12100d"/>
    </radialGradient>
    <clipPath id="lensClip">
      <circle cx="884" cy="202" r="112"/>
    </clipPath>
  </defs>

  <rect width="1128" height="400" fill="url(#paper)"/>
  <rect width="1128" height="400" fill="url(#warmGlow)"/>

  <g stroke="#2b221a" stroke-width="1" opacity="0.6">
    <path d="M0 332h1128M0 368h1128"/>
  </g>

  <!-- lens -->
  <g>
    <circle cx="884" cy="202" r="176" fill="#e8a33d" fill-opacity="0.03"/>
    <circle cx="884" cy="202" r="150" fill="none" stroke="#e8a33d" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 7"/>
    <circle cx="882" cy="202" r="124" fill="none" stroke="#c4553f" stroke-opacity="0.20" stroke-width="1.4"/>
    <circle cx="886" cy="202" r="124" fill="none" stroke="#4aa3a3" stroke-opacity="0.18" stroke-width="1.4"/>
    <circle cx="884" cy="202" r="112" fill="url(#glass)" stroke="#4a3825" stroke-opacity="0.55" stroke-width="1"/>

    <g clip-path="url(#lensClip)">

      <rect x="792" y="170" width="262" height="28" fill="#c4553f" fill-opacity="0.15"/>
      <rect x="790" y="170" width="3" height="28" fill="#c4553f"/>
      <rect x="792" y="198" width="262" height="28" fill="#6fae5b" fill-opacity="0.15"/>
      <rect x="790" y="198" width="3" height="28" fill="#6fae5b"/>

      <g fill="#332a23">
        <rect x="802" y="148" width="118" height="8" rx="4"/>
        <rect x="802" y="176" width="132" height="8" rx="4" fill="#6e4136"/>
        <rect x="802" y="204" width="150" height="8" rx="4" fill="#4c6b42"/>
        <rect x="802" y="232" width="104" height="8" rx="4"/>
        <rect x="802" y="260" width="126" height="8" rx="4"/>
      </g>
    </g>

    <circle cx="884" cy="202" r="112" fill="none" stroke="#e8a33d" stroke-opacity="0.38" stroke-width="1.2"/>
    <path d="M828 122a78 78 0 0 1 52-16" fill="none" stroke="#ffe0b0" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="11" letter-spacing="3.2" fill="#c9924a" xml:space="preserve">VS CODE  EXTENSION</text>

    <text x="70" y="196" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
          font-size="66" font-weight="700" fill="#f4ece0">Change Lens</text>

    <rect x="72" y="218" width="56" height="2" rx="1" fill="#e8a33d"/>

    <text x="72" y="256" font-size="19" fill="#c3b3a1">See the change, not the chat.</text>
    <text x="72" y="284" font-size="14.5" fill="#8b7a67">Local diffing · accept or revert · zero AI calls</text>
  </g>

  <!-- legend -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3937f">
    <circle cx="76" cy="322" r="4" fill="#6fae5b"/>
    <text x="88" y="326">added</text>

    <circle cx="156" cy="322" r="4" fill="#c4553f"/>
    <text x="168" y="326">removed</text>

    <circle cx="252" cy="322" r="4" fill="none" stroke="#e8a33d" stroke-width="1.4"/>
    <text x="264" y="326">works with any agent</text>
  </g>

  <rect width="1128" height="400" fill="url(#vignette)"/>
</svg>
